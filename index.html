<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sanjay Jewellers Sariya | 30 Years of Trust & Heritage</title>
    <meta name="description" content="Sanjay Jewellers Sariya - 30 Years of Trust & Heritage. Pure 22K/24K Gold and 999 Silver Jewellery." />
    <meta property="og:title" content="Sanjay Jewellers Sariya | 30 Years of Trust & Heritage" />
    <meta property="og:description" content="Traditional Indian Gold and Silver Jewellery, Sone-Chandi ke Abhushan, and 100% BIS Hallmarked Purity." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('swarna_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body class="bg-[#faf7f0] text-[#1a1612]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
